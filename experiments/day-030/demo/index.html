<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #6b6b6b;
        --ink: #ffffff;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #title {
        color: var(--ink);
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.03em;
        flex-direction: column;
      }
      #title .sub {
        font-size: 36px;
        font-weight: 400;
        opacity: 0.7;
        margin-top: 16px;
      }
      #chart {
        flex-direction: column;
        align-items: flex-start;
        gap: 28px;
        padding: 0 220px;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 24px;
        width: 100%;
      }
      .bar-label {
        color: var(--ink);
        font-size: 32px;
        width: 220px;
        text-align: right;
      }
      .bar-track {
        flex: 1;
        height: 56px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #4f9dff;
        border-radius: 8px;
      }
      #counter {
        color: var(--ink);
        font-size: 220px;
        font-weight: 700;
      }
      #counter .unit {
        font-size: 64px;
        font-weight: 400;
        opacity: 0.7;
        margin-left: 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="title" class="clip" data-start="0" data-duration="1.6" data-track-index="0">
        <span>HyperFrames day-030</span>
        <span class="sub">Deterministic HTML → MP4 rendering test</span>
      </div>
      <div id="chart" class="clip" data-start="1.4" data-duration="2.8" data-track-index="0">
        <div class="bar-row">
          <div class="bar-label">Run 1 (sec)</div>
          <div class="bar-track"><div class="bar-fill" id="bar1"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label">Run 2 (sec)</div>
          <div class="bar-track"><div class="bar-fill" id="bar2"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label">Run 3 (sec)</div>
          <div class="bar-track"><div class="bar-fill" id="bar3"></div></div>
        </div>
      </div>
      <div id="counter" class="clip" data-start="4.0" data-duration="2.0" data-track-index="0">
        <span id="counter-value">0</span><span class="unit">frames identical</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#title",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        0
      );
      tl.to("#title", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.3);

      tl.fromTo("#bar1", { width: "0%" }, { width: "62%", duration: 0.8, ease: "power2.out" }, 1.6);
      tl.fromTo("#bar2", { width: "0%" }, { width: "81%", duration: 0.8, ease: "power2.out" }, 1.8);
      tl.fromTo("#bar3", { width: "0%" }, { width: "74%", duration: 0.8, ease: "power2.out" }, 2.0);
      tl.to("#chart", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.9);

      const counterProxy = { value: 0 };
      tl.to(
        counterProxy,
        {
          value: 300,
          duration: 1.2,
          ease: "power1.inOut",
          onUpdate: () => {
            document.getElementById("counter-value").textContent = Math.round(counterProxy.value);
          },
        },
        4.2
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
