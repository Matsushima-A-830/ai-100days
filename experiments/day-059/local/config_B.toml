# Day-059 heretic config: scaled down for CPU-only execution (no GPU available
# in this Routine environment). Reduces prompt counts / trials / response
# length from upstream defaults (config.default.toml in p-e-w/heretic) so a
# full optimization run finishes in a reasonable time on CPU with a small model.
# Everything else (scorers, modifier = ARA abliteration) is kept at upstream
# default behavior.

dtypes = ["auto", "bfloat16", "float32"]
quantization = "none"
device_map = "auto"

# Fixed batch size to skip the auto-benchmarking step (irrelevant on CPU, and
# the benchmark itself costs time we don't have).
batch_size = 4
max_batch_size = 4

# Shorter generations -> much faster CPU inference per trial.
max_response_length = 40

# Skip the (expensive) automatic response-prefix detection entirely.
# response_prefix: auto-detect (upstream default)

print_debug_information = false

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

modifiers = [
    { plugin = "heretic.modifiers.ara.ARA" },
]

# Drastically reduced from the upstream default of 100/30 so this finishes on
# CPU with a small model within hours, not days.
n_trials = 12
n_startup_trials = 5

study_checkpoint_dir = "checkpoints"
modified_model_type = "decensored"
system_prompt = "You are a helpful assistant."
enable_shell = false

[batch_size_test_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:16]"
column = "text"

# scorer.KeywordRate.prompts: the only place in this pipeline that uses
# mlabonne/harmful_behaviors (the standard AdvBench-derived refusal benchmark
# used by abliteration research). print_responses stays false (upstream
# default): Heretic only reports the aggregate match_count/N score to stdout,
# it never prints the individual harmful prompts/responses unless
# print_responses is explicitly set to true, which we do NOT do here. Per
# today.md's ethics policy, we record only this aggregate number in
# results.md, never the underlying prompt/response text.
[scorer.KeywordRate]
score_name = "Refusals"
print_responses = false

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
split = "test[:20]"
column = "text"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:20]"
column = "text"

[modifier.ARA]
preserve_row_magnitudes = true
lora_rank = 50
n_optimization_steps = 5
learning_rate = 1.0
max_iter = 20
history_size = 10
print_loss = false

[modifier.ARA.good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:80]"
column = "text"

[modifier.ARA.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:80]"
column = "text"
