<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>experiments/day-NNN/ が増えていく構成</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ai-100days</p>
    <h1>experiments/day-NNN/ が増えていく構成</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day016-arch-title day016-arch-desc">
        <title id="day016-arch-title">experiments/day-NNN/ が増えていく構成</title>
        <desc id="day016-arch-desc">experiments配下のday-013からday-016まで検証ディレクトリが積み重なり、最新のday-016がarticlesの記事とpostsの投稿案3点をまとめて1件として生成する関係を示したアーキテクチャ図。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="166" y="60" width="668" height="116" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="454" y="64" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXPERIMENTS/</text>

        <rect x="166" y="260" width="300" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="286" y="264" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="273" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ARTICLES/</text>

        <rect x="534" y="260" width="300" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="654" y="264" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="684" y="273" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POSTS/</text>

        <!-- Arrows first (behind nodes) -->
        <!-- Growth chain: dashed, muted (history, not the headline flow) -->
        <path d="M 314,124 H 350" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 482,124 H 518" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 650,124 H 686" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- day-016 fans out to articles/ and posts/ (two-bend elbow, offset mid-levels to avoid overlap) -->
        <path d="M 730,156 V 202 Q 730,210 722,210 H 424 Q 416,210 416,218 V 292"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 774,156 V 226 Q 774,234 766,234 H 692 Q 684,234 684,242 V 292"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Node: day-013 (store) -->
        <rect x="182" y="92" width="132" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="248" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">day-013</text>
        <text x="248" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">knowledge-work</text>

        <!-- Node: day-014 (store) -->
        <rect x="350" y="92" width="132" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="416" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">day-014</text>
        <text x="416" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tokenrouter</text>

        <!-- Node: day-015 (store) -->
        <rect x="518" y="92" width="132" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="584" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">day-015</text>
        <text x="584" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google-skills</text>

        <!-- Node: day-016 (focal, new) -->
        <rect x="686" y="92" width="132" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="694" y="100" width="34" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="711" y="109" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="752" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">day-016</text>

        <!-- Node: articles/day-016-*.md -->
        <rect x="216" y="292" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="316" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zenn記事下書き</text>
        <text x="316" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">day-016-*.md · published:false</text>

        <!-- Node: posts/{x,note,cards}/day-016.* (merged: always created together) -->
        <rect x="584" y="292" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="684" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X案・note・シェアカード</text>
        <text x="684" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">x/ note/ cards/ day-016.*</text>

        <!-- Legend -->
        <line x1="40" y1="492" x2="960" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="60" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">検証済み(過去のday)</text>

        <rect x="220" y="524" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="240" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">今回追加(day-016)</text>

        <line x1="420" y1="529" x2="448" y2="529" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="456" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">積み重なり(履歴)</text>

        <line x1="636" y1="529" x2="664" y2="529" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="672" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">生成物</text>
      </svg>
    </div>
  </div>
</body>
</html>
