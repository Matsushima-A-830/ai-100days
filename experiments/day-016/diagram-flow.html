<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai-100daysの1日サイクル</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · ai-100days</p>
    <h1>朝のリサーチから夜の公開までの1日サイクル</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="day016-flow-title day016-flow-desc">
        <title id="day016-flow-title">ai-100daysの1日サイクル</title>
        <desc id="day016-flow-desc">リサーチRoutineからbacklog更新、人間によるtoday.md反映、実装Routineでの検証、夜の人間レビューと公開までを示すフローチャート。today.md未設定時は実装Routineが起動せず待機する分岐を含む。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="500" y1="88"  x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="500" y1="168" x2="500" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="500" y1="248" x2="500" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond "NO" right: today.md未設定 -->
        <line x1="600" y1="328" x2="720" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond "YES" down (coral — happy path continues) -->
        <line x1="500" y1="376" x2="500" y2="424" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="500" y1="480" x2="500" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="500" y1="584" x2="500" y2="616" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="644" y="308" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

        <rect x="508" y="392" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="401" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

        <!-- Start oval: リサーチRoutine -->
        <rect x="380" y="40" width="240" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">朝: リサーチRoutine起動</text>
        <text x="500" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">自動・毎朝</text>

        <!-- Rect1: backlog更新 -->
        <rect x="380" y="120" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">海外ソース巡回・backlog更新</text>
        <text x="500" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backlog.md → PR</text>

        <!-- Rect2: human commute, today.md反映 -->
        <rect x="380" y="200" width="240" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="500" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">通勤中: 人間がPRマージ</text>
        <text x="500" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">today.md 反映</text>

        <!-- Diamond: today.md設定済み? -->
        <polygon points="500,280 600,328 500,376 400,328" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">today.mdは</text>
        <text x="500" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">設定済み?</text>

        <!-- End oval: 待機 (today.md未設定) -->
        <rect x="720" y="304" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="820" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">何もせず終了</text>
        <text x="820" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PR作成なし</text>

        <!-- Rect3 (focal, happy path): 実装Routine -->
        <rect x="380" y="424" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="500" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">昼: 検証して記事・X案・note</text>
        <text x="500" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">・カードを作成</text>
        <text x="500" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">experiments/day-NNN → PR</text>

        <!-- Rect4: human review -->
        <rect x="380" y="536" width="240" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="500" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">夜: 人間がPRレビュー</text>
        <text x="500" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">再現検証・感想を追記</text>

        <!-- Final oval: 公開 -->
        <rect x="380" y="616" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="500" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">マージ・公開</text>
        <text x="500" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">published:true → X/note/Obsidian</text>

        <!-- Legend -->
        <line x1="40" y1="700" x2="960" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="732" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="742" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">開始・終了(楕円)</text>

        <rect x="240" y="732" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="272" y="742" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">自動ステップ(矩形)</text>

        <rect x="440" y="732" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="472" y="742" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">人間のステップ</text>

        <polygon points="652,738 664,732 676,738 664,744" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="688" y="742" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">分岐(ひし形)</text>

        <line x1="804" y1="738" x2="832" y2="738" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="840" y="742" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">本線</text>
      </svg>
    </div>
  </div>
</body>
</html>
